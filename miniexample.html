<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> counter</h1>
    <h2>current counter:<span id="counter">0</span></h2>
    <button type="button" id="increment">increment</button>
    <br>
    <button type="button" id="decrement">decrement</button>
    <button type="button" id="reset">reset</button>
    
    </script>
    <script>
        let count=0
        counter=document.getElementById('counter')
        incrementButton=document.getElementById('increment')
        decrementButton=document.getElementById('decrement')
        resetButton=document.getElementById('reset')
        incrementButton.addEventListener(
            'click',
            function(){
                count ++;
                counter.textContent=count
            }
        )
        decrementButton.addEventListener(
            'click',
            function(){
                count --;
                counter.textContent=count
            }
        )
        resetButton.addEventListener(
            'click',
            function(){
                count= 0;
                counter.textContent=count
            }
        )
</script>
</body>
</html>
