<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 320px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px #cccccc;
        }

        h1 {
            color: #222;
            font-size: 25px;
        }

        #count {
            font-size: 65px;
            color: #2455b5;
            margin: 25px 0;
        }

        button {
            padding: 14px 22px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #plus {
            background-color: #287bd8;
        }

        #minus {
            background-color: #e58a32;
        }

        #reset {
            background-color: #34445f;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Click Counter</h1>

        <h2 id="count">0</h2>

        <button id="plus">+1</button>
        <button id="minus">-1</button>
        <button id="reset">Reset</button>
    </div>

    <script>
        // Initial value
        let n = 0;

        // Select HTML elements using DOM
        const out = document.getElementById("count");
        const plus = document.getElementById("plus");
        const minus = document.getElementById("minus");
        const reset = document.getElementById("reset");

        // Increase count
        plus.addEventListener("click", () => {
            n++;
            out.textContent = n;
        });

        // Decrease count
        minus.addEventListener("click", () => {
            n--;
            out.textContent = n;
        });

        // Reset count
        reset.addEventListener("click", () => {
            n = 0;
            out.textContent = n;
        });
    </script>

</body>
</html>
